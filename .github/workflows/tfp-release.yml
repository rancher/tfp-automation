---
name: Rancher2 Release Sanity

on:
  workflow_dispatch:
    inputs:
      rancher_version:
        description: "Rancher tag version (i.e. v2.15-head)"
        required: true
      rancher_chart_version:
        description: "Rancher chart version (i.e. 2.15.0 - no leading v)"
        required: true
      rancher2_provider_version:
        description: "Rancher2 provider version (i.e. 14.1.1 - no leading v)"
        required: true
      local_cluster_type:
        description: "Local cluster type to setup Rancher"
        required: true
        default: "rke2"
        type: choice
        options:
          - k3s
          - rke2
      local_cluster_k8s_version:
        description: "Kubernetes version for the local cluster (i.e. v1.35.6, remove suffix)"
        required: true
      reporting:
        description: "Enable reporting to Slack"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  CLOUD_PROVIDER_VERSION: "6.50.0"
  RANCHER_VERSION: ${{ github.event.inputs.rancher_version }}
  RANCHER_CHART_VERSION: ${{ github.event.inputs.rancher_chart_version }}
  RANCHER2_PROVIDER_VERSION: "${{ github.event.inputs.rancher2_provider_version }}"
  LOCAL_CLUSTER_TYPE: ${{ github.event.inputs.local_cluster_type }}
  LOCAL_CLUSTER_K8S_VERSION: ${{ github.event.inputs.local_cluster_k8s_version }}
  LOCALS_PROVIDER_VERSION: "${{ vars.LOCALS_PROVIDER_VERSION }}"
  PACKAGE: "rancher2/provisioning"
  TEST_SUITE: "^TestTfpProvisionTestSuite$"
  TIMEOUT: "2h"

jobs:
  tfp-release:
    name: ${{ github.event.inputs.rancher_version }}
    runs-on: ubuntu-latest
    environment: prime-head
    env:
      HOSTNAME_PREFIX: "tfp-post"
      REPORTING_ENABLED: (github.event_name == 'workflow_dispatch' && github.event.inputs.reporting == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.TFP_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3
        with:
          secret-ids: |
            AWS_ACCESS_KEY, ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY, ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME, HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME
            HB_SSH_PRIVATE_KEY, HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME, HB_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN, HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME, HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY, HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME, HB_PRIVATE_CERT_KEY_NAME
            HB_AWS_REGION, HB_AWS_REGION
            HB_TERRAFORM_VERSION, HB_TERRAFORM_VERSION
            HB_RANCHER_ADMIN_PASSWORD, HB_RANCHER_ADMIN_PASSWORD
            HB_RKE2_VERSION_2_16, HB_RKE2_VERSION_2_16
            HB_K3S_VERSION_2_16, HB_K3S_VERSION_2_16
            HB_RKE2_VERSION_2_15, HB_RKE2_VERSION_2_15
            HB_K3S_VERSION_2_15, HB_K3S_VERSION_2_15
            HB_RKE2_VERSION_2_14, HB_RKE2_VERSION_2_14
            HB_K3S_VERSION_2_14, HB_K3S_VERSION_2_14
            HB_K3S_VERSION_SUFFIX, HB_K3S_VERSION_SUFFIX
            HB_QA_PRIVATE_REGISTRY_NAME, HB_QA_PRIVATE_REGISTRY_NAME
            HB_QASE_AUTOMATION_TOKEN, HB_QASE_AUTOMATION_TOKEN
            HB_QASE_PROJECT_ID, HB_QASE_PROJECT_ID
            HB_RANCHER_HELM_CHART_URL, HB_RANCHER_HELM_CHART_URL
            HB_STAGING_RANCHER_HELM_CHART_URL, HB_STAGING_RANCHER_HELM_CHART_URL
            HB_SLACK_WEBHOOK_URL, HB_SLACK_WEBHOOK_URL

      - name: Fetch and Set DockerHub Credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 #v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials username | DOCKERHUB_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials password | DOCKERHUB_PASSWORD

      - name: Masking Secrets
        uses: ./.github/actions/mask-secrets
        with:
          secrets: |
            ${{ env.DOCKERHUB_USERNAME }}
            ${{ env.DOCKERHUB_PASSWORD }}
            ${{ fromJSON(env.HB_SSH_PRIVATE_KEY).value }}
            ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN).value }}
            ${{ fromJSON(env.HB_PRIVATE_CERT_KEY).value }}

      - name: Whitelist Runner IP
        id: whitelist-runner-ip
        uses: ./.github/actions/whitelist-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME).value }}
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"

      - name: Set up SSH Keys
        id: setup-ssh-keys
        uses: ./.github/actions/setup-ssh-keys
        with:
          ssh-private-key: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY).value }}
          ssh-private-key-name: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY_NAME).value }}

      - name: Set up certificates
        id: setup-certs
        uses: ./.github/actions/setup-certs
        with:
          private-full-chain: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN).value }}
          private-full-chain-name: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN_NAME).value }}
          private-cert-key: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY).value }}
          private-cert-key-name: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY_NAME).value }}

      - name: Uniquify hostname prefix
        uses: ./.github/actions/uniquify-hostname

      - name: Create config.yaml
        run: |
          cat > config.yaml <<EOF
          rancher:
            host: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"

          awsCredentials:
            accessKey: "$AWS_ACCESS_KEY"
            secretKey: "$AWS_SECRET_KEY"
            defaultRegion: "${{ fromJSON(env.HB_AWS_REGION).value }}"

          terraform:
            localCluster: "${{ env.LOCAL_CLUSTER_TYPE }}"
            privateKeyPath: "${{ steps.setup-ssh-keys.outputs.ssh-private-key-path }}"
            privateFullChainPath: "${{ steps.setup-certs.outputs.private-full-chain-path }}"
            privateCertKeyPath: "${{ steps.setup-certs.outputs.private-cert-key-path }}"
            resourcePrefix: "${{ env.HOSTNAME_PREFIX }}"
            privateRegistries:
              url: "<HB_PRIVATE_REGISTRY_URL>"
              username: "<HB_DOCKERHUB_USERNAME>"
              password: "<HB_DOCKERHUB_PASSWORD>"
              insecure: true
              authConfigSecretName: "<HB_AUTH_CONFIG_SECRET_NAME>"
              mirrorHostname: "<HB_PRIVATE_REGISTRY_MIRROR_HOSTNAME>"
              mirrorEndpoint: "<HB_PRIVATE_REGISTRY_MIRROR_ENDPOINT>"
            awsConfig:
              rancherSubnetID: "<HB_RANCHER_SUBNET_ID>"

            standalone:
              chartVersion: "${{ env.RANCHER_CHART_VERSION }}"
              k3sVersion: "${{ env.LOCAL_CLUSTER_K8S_VERSION}}${{ fromJSON(env.HB_K3S_VERSION_SUFFIX).value }}"
              rancherTagVersion: "${{ env.RANCHER_VERSION }}"
              registryPassword: "${{ env.DOCKERHUB_PASSWORD }}"
              registryUsername: "${{ env.DOCKERHUB_USERNAME }}"
              rancherHostname: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
              rke2Version: "${{ env.LOCAL_CLUSTER_K8S_VERSION }}"
          EOF

      - name: Export CATTLE_TEST_CONFIG
        run: echo "CATTLE_TEST_CONFIG=${{ github.workspace }}/config.yaml" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "./go.mod"

      - name: Build Packages
        run: ./.github/scripts/build-packages.sh

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 #v4
        with:
          terraform_version: "${{ fromJSON(env.HB_TERRAFORM_VERSION).value }}"
          terraform_wrapper: false

      - name: Setup Rancher2 Provider if RC is present
        if: contains(env.RANCHER2_PROVIDER_VERSION, '-rc')
        run: /home/runner/${{ secrets.PATH_TO_REPO }}/scripts/setup-provider.sh rancher2 v${{ env.RANCHER2_PROVIDER_VERSION }}
        shell: bash

      - name: Creating Rancher server
        run: go run /home/runner/${{ secrets.PATH_TO_REPO }}/tests/rancher2/recurring/createRancherServer.go

      - name: Run Rancher2 Test Suite
        uses: ./.github/actions/run-test-suite
        with:
          package: ${{ env.PACKAGE }}
          test-suite: ${{ env.TEST_SUITE }}
          timeout: ${{ env.TIMEOUT }}
          tags: "sanity"

      - name: Cleanup Infrastructure
        if: always()
        working-directory: /home/runner/${{ secrets.PATH_TO_REPO }}/modules/sanity/aws
        run: terraform destroy -auto-approve > /dev/null 2>&1

      - name: Cloud Provider Infrastructure Cleanup
        if: always()
        uses: ./.github/actions/cloud-provider-cleanup
        with:
          prefix: "${{ env.HOSTNAME_PREFIX }}"
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"
          iam-role: ${{ secrets.TFP_IAM_ROLE }}

      - name: Cloud Provider Downstream Cleanup
        if: always()
        uses: ./.github/actions/cloud-provider-cleanup
        with:
          prefix: "auto-${{ env.HOSTNAME_PREFIX }}"
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"
          iam-role: ${{ secrets.TFP_IAM_ROLE }}

      - name: Revoke Runner IP
        if: always()
        uses: ./.github/actions/revoke-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME).value }}
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"

      - name: Reporting Results to Slack
        if: always() && env.REPORTING_ENABLED == 'true'
        uses: ./.github/actions/report-to-slack
        with:
          rancher-version: ${{ env.RANCHER_VERSION }}
          job-status: ${{ steps.set-job-status.outputs.job_status }}
          slack-webhook-url: ${{ fromJSON(env.HB_SLACK_WEBHOOK_URL).value }}