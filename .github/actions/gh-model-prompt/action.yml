---
name: "GH Model Prompt"
description: "Run a GitHub Model prompt using a .prompt.yml and dynamic input"
inputs:
  prompt_file:
    description: "Path to the .prompt.yml file"
    required: true
  input_file:
    description: "Path to the file containing input to inject as PRs"
    required: true
  output_file:
    description: "File to write the model output to"
    required: true
outputs:
  summary:
    description: "The model output summary"
    value: ${{ steps.run-prompt.outputs.summary }}

runs:
  using: composite
  steps:
    - id: run-prompt
      run: |
        PROMPT_TEMPLATE=$(yq -r '.messages[] | select(.role=="user") | .content' "${{ inputs.prompt_file }}")
        MODEL_NAME=$(yq -r '.model // ""' "${{ inputs.prompt_file }}")
        INPUT_CONTENT=$(cat "${{ inputs.input_file }}")

        if [[ "$PROMPT_TEMPLATE" == *'{{input}}'* ]]; then
          PROMPT_CONTENT=${PROMPT_TEMPLATE//'{{input}}'/$INPUT_CONTENT}
        else
          PROMPT_CONTENT="$PROMPT_TEMPLATE"
          PROMPT_CONTENT+=$'\n\nInput:\n'
          PROMPT_CONTENT+="$INPUT_CONTENT"
        fi

        MODEL_ARGS=()
        if [[ -n "$MODEL_NAME" ]]; then
          MODEL_ARGS=(--model "$MODEL_NAME")
        fi

        STDOUT_FILE=$(mktemp)
        STDERR_FILE=$(mktemp)

        set +e
        npx -y @github/copilot@latest -p "$PROMPT_CONTENT" -s --no-ask-user "${MODEL_ARGS[@]}" >"$STDOUT_FILE" 2>"$STDERR_FILE"
        COPILOT_EXIT=$?
        set -e

        if [[ $COPILOT_EXIT -ne 0 ]]; then
          if grep -Eiq 'rate limit|429|quota|ai credits' "$STDERR_FILE"; then
            echo "Rate limit detected."
            echo "RATE_LIMITED" > "${{ inputs.output_file }}"
            exit 22
          fi

          cat "$STDERR_FILE"
          exit "$COPILOT_EXIT"
        fi

        cat "$STDOUT_FILE" > "${{ inputs.output_file }}"

        echo 'summary<<EOF' >> $GITHUB_OUTPUT
        cat "${{ inputs.output_file }}" >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
      shell: bash