---
name: Check Prime Head Results
description: "Checks if all dispatch workflows have successful prime head job completions for specified release lines"

inputs:
  dispatch-workflow-list:
    description: "Comma-separated list of dispatch workflow names to check"
    required: true

outputs:
  complete_v215:
    description: "Whether v2.15 prime head release testing is complete"
    value: ${{ steps.check-releases.outputs.complete_v215 }}
  failed_workflows_v215:
    description: "Comma-separated list of workflows that need v2.15 re-run"
    value: ${{ steps.check-releases.outputs.failed_workflows_v215 }}
  complete_v214:
    description: "Whether v2.14 prime head release testing is complete"
    value: ${{ steps.check-releases.outputs.complete_v214 }}
  failed_workflows_v214:
    description: "Comma-separated list of workflows that need v2.14 re-run"
    value: ${{ steps.check-releases.outputs.failed_workflows_v214 }}
  complete_v213:
    description: "Whether v2.13 prime head release testing is complete"
    value: ${{ steps.check-releases.outputs.complete_v213 }}
  failed_workflows_v213:
    description: "Comma-separated list of workflows that need v2.13 re-run"
    value: ${{ steps.check-releases.outputs.failed_workflows_v213 }}

runs:
  using: composite
  steps:
    - id: check-releases
      env:
        SANITIZED_RELEASES: "v215 v214 v213"
        GH_TOKEN: ${{ github.token }}
      run: |
        WORKFLOWS="${{ inputs.dispatch-workflow-list }}"

        workflow_applies_to_head_release() {
          local workflow="$1"
          local job_version="$2"
          local workflow_path=".github/workflows/$workflow"

          if [[ ! -f "$workflow_path" ]]; then
            return 0
          fi

          grep -qF "startsWith(github.event.inputs.rancher_version, '$job_version')" "$workflow_path" || \
          grep -qF "startsWith(inputs.rancher_version, '$job_version')" "$workflow_path" || \
          grep -qF "startsWith(github.event.inputs.rancher_version, 'head')" "$workflow_path" || \
          grep -qF "startsWith(inputs.rancher_version, 'head')" "$workflow_path"
        }

        for release in ${SANITIZED_RELEASES//,/ }; do
          ALL_PASSED=true
          FAILED_WORKFLOWS=""
          JOB_KEY="v${release:1:1}-${release:2}"
          JOB_VERSION="v${release:1:1}.${release:2}-head"
          
          echo "Checking $release jobs..."
          for workflow in ${WORKFLOWS//,/ }; do
            RUN_IDS=$(gh api repos/${{ github.repository }}/actions/workflows/${workflow}/runs \
              --jq '[.workflow_runs[] | select(.head_branch=="main" and (.event=="schedule" or .event=="workflow_dispatch"))] | .[0:30] | .[].id')

            if [[ -z "$RUN_IDS" ]]; then
              echo "  $workflow: No recent runs found"
              ALL_PASSED=false
              FAILED_WORKFLOWS="${FAILED_WORKFLOWS}${workflow},"
              continue
            fi

            JOB_FOUND=""
            if ! workflow_applies_to_head_release "$workflow" "$JOB_VERSION"; then
              echo "  - $workflow does not run for $JOB_VERSION, skipping..."
              continue
            fi

            for RUN_ID in $RUN_IDS; do
              JOB_SUCCESS=$(gh api repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs \
                --jq ".jobs[] | select((.name==\"${JOB_KEY}\" or .name==\"${JOB_VERSION}\") and .conclusion==\"success\") | .name" 2>/dev/null)
              if [[ -n "$JOB_SUCCESS" ]]; then
                JOB_FOUND="true"
                break
              fi
            done

            if [[ -z "$JOB_FOUND" ]]; then
              echo "  - $workflow did not pass, needs to re-run..."
              ALL_PASSED=false
              FAILED_WORKFLOWS="${FAILED_WORKFLOWS}${workflow},"
            else
              echo "  - $workflow has a successful run!"
            fi
          done

          if [[ "$ALL_PASSED" == "true" ]]; then
            echo "complete_${release}=true" >> $GITHUB_OUTPUT
          else
            echo "complete_${release}=false" >> $GITHUB_OUTPUT
          fi
          
          FAILED_WORKFLOWS="${FAILED_WORKFLOWS%,}"
          echo "failed_workflows_${release}=${FAILED_WORKFLOWS}" >> $GITHUB_OUTPUT
        done
      shell: bash